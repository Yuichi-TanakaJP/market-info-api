name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate Linux Python 3.11 lock files
        run: |
          python -m pip install pip-tools
          python -m piptools compile --strip-extras pyproject.toml --output-file requirements.lock
          python -m piptools compile --strip-extras --extra dev pyproject.toml --output-file requirements-dev.lock

      - name: Upload regenerated lock files
        uses: actions/upload-artifact@v4
        with:
          name: linux-python311-locks
          path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: App import check
        run: python -c "from app.main import app; assert app.title == 'market-info-api'"
        env:
          R2_PUBLIC_BASE_URL: https://r2.example.com
