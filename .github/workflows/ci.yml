name: CI

on:
  push:
    branches: [main]
    # Only this reviewed documentation path is ignored; new paths run CI.
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [main]
    # Only this reviewed documentation path is ignored; new paths run CI.
    paths-ignore:
      - 'README.md'

# Keep only the latest PR validation; preserve independent main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: App import check
        run: python -c "from app.main import app; assert app.title == 'market-info-api'"
        env:
          R2_PUBLIC_BASE_URL: https://r2.example.com
